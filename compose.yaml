# =============================================================================
# MC Send Notify: servicios base. Autor: Ing. Heri Espinosa
#
#   Desarrollo:  docker compose up            (aplica también compose.override.yaml)
#   Producción:  docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Las variables ${...} se leen de `.env` (ver .env.example).
# =============================================================================
name: mc-send-notify

x-app-environment: &app-environment
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-production}
  APP_URL: ${APP_URL}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://storage:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  GOTENBERG_URL: http://gotenberg:3000
  AUTH_SECRET: ${AUTH_SECRET}
  AUTH_TRUST_HOST: 'true'
  AUTH_CREDENTIALS_ENABLED: ${AUTH_CREDENTIALS_ENABLED:-true}
  AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
  AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
  AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
  AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
  ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID}
  TRACKING_SIGNING_SECRET: ${TRACKING_SIGNING_SECRET}
  SYSTEM_MAIL_SMTP_URL: ${SYSTEM_MAIL_SMTP_URL:-}
  SYSTEM_MAIL_FROM: ${SYSTEM_MAIL_FROM:-MC Send Notify <noreply@mcsend.local>}
  SSRF_ALLOW_PRIVATE: ${SSRF_ALLOW_PRIVATE:-false}
  WORKER_HEALTH_PORT: '9464'
  MCLOG_URL: ${MCLOG_URL:-}
  MCLOG_API_KEY: ${MCLOG_API_KEY:-}
  MCLOG_APPLICATION: ${MCLOG_APPLICATION:-mc-send-notify}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # PostgreSQL 18 guarda los datos en un subdirectorio por versión de /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  # Almacenamiento S3 compatible. Sustituye a MinIO, cuyas imágenes dejaron de publicarse
  # (ver docs/adr/0003-seaweedfs-object-storage.md).
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ['mini', '-dir=/data', '-bucket=${S3_BUCKET}', '-admin.ui=false']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Conversión de PPTX/DOCX/HTML/MD a PDF (LibreOffice y Chromium).
  # Chromium sin JavaScript y sin acceso a URL externas: un HTML subido no puede ejecutar
  # código ni hacer peticiones a la red interna (SSRF).
  gotenberg:
    image: gotenberg/gotenberg:8.25
    restart: unless-stopped
    command:
      [
        'gotenberg',
        '--api-timeout=120s',
        '--log-level=warn',
        '--chromium-disable-javascript=true',
        '--chromium-allow-list=^file:///tmp/.*',
      ]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9464/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  storage-data:
