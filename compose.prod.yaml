# =============================================================================
# Producción en VM: Caddy publica la app con TLS automático (Let's Encrypt).
# Uso: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Ningún servicio interno publica puertos; solo Caddy expone 80 y 443.
# =============================================================================
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
